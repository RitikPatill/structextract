[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structextract"
version = "0.1.0"
description = "Turn unstructured documents into validated, schema-defined JSON with source grounding"
requires-python = ">=3.10"
authors = [
    { name = "Ritik" }
]
dependencies = [
    "anthropic>=0.28,<0.29",
    "openai>=1.30,<1.31",
    "pdfplumber>=0.11,<0.12",
    "beautifulsoup4>=4.12,<4.13",
    "markdown-it-py>=3.0,<3.1",
    "pydantic>=2.7,<2.8",
    "click>=8.1,<9.0",
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.30,<0.31",
]

[project.scripts]
structextract = "structextract.cli:cli"
